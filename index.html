<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8a2aa2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>legit</title>
    <script>
      // The first requests, sent while the bundle loads; `request` (lib/app.svelte.ts) takes each once.
      window.__legitEarly = Object.fromEntries(
        ['/api/state', '/api/display'].map((path) => {
          const res = fetch(path);
          res.catch(() => {});
          return [path, res];
        }),
      );
      // Dark from the first frame, rather than once the bundle has run (main.ts's applyTheme follows the system from there).
      if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
