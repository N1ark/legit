<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b045ab"/><stop offset="0.55" stop-color="#8a2aa2"/><stop offset="1" stop-color="#451551"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <style>.line{fill:none;stroke:#fff;stroke-width:44;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#fff;stroke-width:28;stroke-linecap:round;stroke-linejoin:round}.fill{fill:#fff}.faint{opacity:0.55}.cut{fill:#8a2aa2}</style>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
  <g><path class="line" d="M430 230 V794"/>
<path class="line faint" d="M430 400 C430 470 600 450 600 512 C600 574 430 554 430 624"/>
<circle class="fill" cx="430" cy="300" r="62"/>
<circle class="fill" cx="430" cy="724" r="62"/>
<circle class="fill" cx="600" cy="512" r="78"/>
<circle class="cut" cx="600" cy="512" r="34"/>
</g>
</svg>
